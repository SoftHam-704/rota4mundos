<!-- ABERTURA DO ROTA 4 MUNDOS — colada inteira no index.html pelo plugin "r4m-abertura" (vite.config.js).
     Fica no HTML (não no React) de propósito: o bundle tem ~600 KB comprimidos, e uma abertura em
     CSS puro pinta no primeiro instante e roda liso enquanto o JavaScript ainda baixa. Não mede
     carregamento e não mente progresso: é a TRAVESSIA — as quatro faixas do logo se traçam na ordem
     da rota (Brasil → Paraguai → Argentina → Chile) com o nome de cada país, a estrela acende,
     o nome se monta e a ESTRELA vira a passagem: um recorte por onde já se vê o site, que cresce
     até engolir a tela (inspiração: a janela do jeskojets.com). O hero não é tocado.
     Regras da casa (C:\Sites\01-Sites\SoftHam-Site\qg\arsenal\TECNICAS.md, "Abertura"):
     só na página inicial, uma vez por sessão, Pular + Esc, quem pede menos movimento não vê. -->
<style>
#r4m-abertura{--eo:cubic-bezier(.23,1,.32,1);--eio:cubic-bezier(.77,0,.175,1);position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:radial-gradient(ellipse 80% 70% at 50% 42%,#0d3557 0%,#061b33 55%,#020d1a 100%);clip-path:polygon(0 0,100% 0,100% 100%,0 100%);color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden}
html.r4m-abrindo,html.r4m-abrindo body{overflow:hidden}
#r4m-abertura .p{display:flex;flex-direction:column;align-items:center;transform:translateZ(0)}
#r4m-abertura svg{width:min(58vmin,440px);height:auto;overflow:visible}
#r4m-abertura .fx path{fill:none;stroke-linecap:butt;stroke-width:13;stroke-dasharray:1;stroke-dashoffset:1;animation:r4m-traca var(--d,620ms) var(--eio) var(--t) forwards}
#r4m-abertura .seta{opacity:0;transform-box:fill-box;transform-origin:30% 70%;animation:r4m-acende 380ms var(--eo) 1900ms forwards}
#r4m-abertura .estrela{opacity:0;transform-box:fill-box;transform-origin:center;animation:r4m-estrela 800ms var(--eo) 2020ms forwards}
#r4m-abertura .brilho{opacity:0;transform-box:fill-box;transform-origin:center;animation:r4m-brilho 1200ms var(--eo) 2020ms forwards}
#r4m-abertura .nome{margin-top:clamp(18px,3.4vmin,30px);font:400 clamp(40px,9vmin,84px)/1 "Bebas Neue",Inter,sans-serif;letter-spacing:.14em;white-space:nowrap}
#r4m-abertura .nome span{display:inline-block;opacity:0;transform:translateY(55%);animation:r4m-letra 520ms var(--eo) calc(1650ms + var(--i) * 36ms) forwards}
#r4m-abertura .nome .n4{color:#f4a261}
#r4m-abertura .via{position:relative;margin-top:clamp(10px,2vmin,18px);height:1.3em;width:min(90vw,560px);overflow:hidden;font:500 italic clamp(22px,4.4vmin,38px)/1.3 "Playfair Display",Georgia,serif}
#r4m-abertura .c{position:absolute;inset:0;text-align:center;transform:translateY(105%)}
#r4m-abertura .c{animation:r4m-painel var(--d,190ms) var(--eio) var(--t) both}
#r4m-abertura .c.ult{animation:r4m-chega 260ms var(--eo) var(--t) both}
#r4m-abertura .faixa{display:flex;gap:4px;width:min(60vw,320px);margin-top:clamp(10px,2vmin,16px)}
#r4m-abertura .faixa i{flex:1;height:3px;border-radius:2px;background:var(--c);transform:scaleX(0);transform-origin:left;animation:r4m-enche var(--d) linear var(--t) forwards}
#r4m-abertura .pular{position:absolute;right:clamp(16px,3vw,32px);bottom:clamp(16px,3vh,28px);padding:10px 14px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);font:500 12px/1 Inter,sans-serif;letter-spacing:.12em;cursor:pointer;opacity:0;animation:r4m-passa-in 400ms var(--eo) 600ms forwards}
#r4m-abertura .pular:focus-visible{outline:2px solid #f4a261;outline-offset:2px}
@media (hover:hover) and (pointer:fine){#r4m-abertura .pular:hover{color:#fff;border-color:rgba(255,255,255,.4)}}
/* saída: a cortina se recolhe para o canto da estrela, na diagonal da seta; a marca parte junto */
#r4m-abertura.is-saindo .p{animation:r4m-recua 900ms var(--eio) 480ms forwards}
#r4m-abertura.is-saindo .pular{opacity:0;transition:opacity 200ms}
#r4m-passagem{position:fixed;inset:0;z-index:2147483001;pointer-events:none}
#r4m-abertura.is-cortando{transition:opacity 280ms var(--eo);opacity:0}
@keyframes r4m-traca{to{stroke-dashoffset:0}}
@keyframes r4m-acende{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes r4m-estrela{0%{opacity:0;transform:scale(.6) rotate(-40deg)}60%{opacity:1;transform:scale(1.18) rotate(6deg)}100%{opacity:1;transform:none}}
@keyframes r4m-brilho{0%{opacity:0;transform:scale(.4)}35%{opacity:.9}100%{opacity:0;transform:scale(2.4)}}
@keyframes r4m-letra{to{opacity:1;transform:none}}
@keyframes r4m-painel{0%{transform:translateY(105%)}22%,78%{transform:none}100%{transform:translateY(-105%)}}
@keyframes r4m-chega{from{transform:translateY(105%)}to{transform:none}}
@keyframes r4m-passa-in{to{opacity:1}}
@keyframes r4m-enche{to{transform:scaleX(1)}}
@keyframes r4m-recua{to{opacity:0;transform:scale(.94);filter:blur(6px)}}
@media (prefers-reduced-motion:reduce){#r4m-abertura{display:none}}
</style>
<div id="r4m-abertura" aria-hidden="true">

<div class="p">

<!-- a ordem das faixas é a ordem da travessia; cada uma se traça enquanto as cidades do seu país passam -->

</g>

<polygon class="estrela" fill="#f4a261" points="408,6 412.7,18.5 426,19 415.6,27 419.3,40 408,32.6 396.7,40 400.4,27 390,19 403.3,18.5"/>
</svg>
<div class="nome" aria-hidden="true"><span style="--i:0">R</span><span style="--i:1">O</span><span style="--i:2">T</span><span style="--i:3">A</span><span style="--i:4">&nbsp;</span><span class="n4" style="--i:5">4</span><span style="--i:6">&nbsp;</span><span style="--i:7">M</span><span style="--i:8">U</span><span style="--i:9">N</span><span style="--i:10">D</span><span style="--i:11">O</span><span style="--i:12">S</span></div>

<span class="c" data-p="0" style="--t:150ms;--d:560ms;color:#7be0a0">Brasil</span>

<span class="c" data-p="2" style="--t:1080ms;--d:500ms;color:#a9d3f5">Argentina</span>

<button type="button" class="pular" aria-label="Pular abertura">PULAR&nbsp;›</button>
<script>
(function(){
  var el=document.getElementById("r4m-abertura");if(!el)return;
  var raiz=document.documentElement,caminho=location.pathname.replace(/\/+$/,"");
  var inicio=caminho===""||caminho==="/es"||caminho==="/en",visto=null;
  try{visto=sessionStorage.getItem("r4m-abertura")}catch(e){}
  var robo=/bot|crawl|spider|slurp|lighthouse|headless|preview/i.test(navigator.userAgent)&&!/r4m-gravacao/.test(location.search);
  if(!inicio||visto||robo||matchMedia("(prefers-reduced-motion: reduce)").matches){el.parentNode.removeChild(el);return}
  try{sessionStorage.setItem("r4m-abertura","1")}catch(e){}
  // idioma: só o que muda de grafia
  var l=caminho==="/es"?"es":caminho==="/en"?"en":"pt";
  var P={pt:["Brasil","Paraguai","Argentina","Chile"],es:["Brasil","Paraguay","Argentina","Chile"],en:["Brazil","Paraguay","Argentina","Chile"]}[l];
  el.querySelectorAll(".c").forEach(function(c){c.textContent=P[+c.getAttribute("data-p")]});
  el.querySelector(".pular").textContent={pt:"PULAR",es:"SALTAR",en:"SKIP"}[l]+"\u00a0\u203a";
  raiz.classList.add("r4m-abrindo");
  try{history.scrollRestoration="manual"}catch(e){}
  scrollTo(0,0);
  // A cortina abre quando a travessia termina E o site já montou atrás dela (evento do main.jsx).
  // Em 4G lento o bundle pode demorar: a estrela fica acesa até o site estar pronto, no máximo 9 s.
  var tempo=false,pronto=!!window.__r4mPronto,foi=false;
  function sair(cortando){
    if(foi)return;foi=true;
    if(cortando){
      el.classList.add("is-cortando");
      window.dispatchEvent(new CustomEvent("r4m:abriu"));
      setTimeout(fim,300);
      return;
    }
    el.classList.add("is-saindo");
    passagem();
  }
  // A PASSAGEM PELA ESTRELA (Hamilton, 03/10). Inspiração: a janela do jeskojets.com, o
  // "efeito-assinatura" do catálogo do diretor-de-cena — uma forma da própria cena cresce até
  // engolir a tela e a cena seguinte já está dentro dela. A nossa forma é a ESTRELA do logo: ela
  // vira um recorte na abertura, por onde já se vê o site, e cresce girando de leve até engolir a
  // tela. O contorno de luz dourada acompanha. Redesenhada a cada quadro (nítida em qualquer
  // escala); o furo é clip-path na abertura, então o hero aparece como é, sem ser tocado.
  function passagem(){
    var NS="http://www.w3.org/2000/svg",W=innerWidth,H=innerHeight;
    var e=el.querySelector(".estrela").getBoundingClientRect();
    var x0=e.left+e.width/2,y0=e.top+e.height/2,r0=Math.max(e.width,e.height)/2; // estrela do logo
    var svg=document.createElementNS(NS,"svg");svg.id="r4m-passagem";
    svg.setAttribute("width",W);svg.setAttribute("height",H);svg.setAttribute("aria-hidden","true");
    svg.innerHTML='<path class="halo" fill="none" stroke="#f4a261" stroke-linejoin="round"/><path class="aro" fill="none" stroke="#ffe2b8" stroke-linejoin="round"/>';
    document.body.appendChild(svg);
    var halo=svg.querySelector(".halo"),aro=svg.querySelector(".aro");
    var tela="M0 0H"+W+"V"+H+"H0Z";
    function estrela(cx,cy,r,giro){ // 5 pontas, raio interno 0,42 (o mesmo desenho do logo)
      var d="";
      for(var i=0;i<10;i++){
        var a=(i*36-90+giro)*Math.PI/180,rad=i%2?r*.42:r;
        d+=(i?"L":"M")+(cx+rad*Math.cos(a)).toFixed(1)+" "+(cy+rad*Math.sin(a)).toFixed(1);
      }
      return d+"Z";
    }
    function desenha(cx,cy,r,giro,brilho){
      var d=estrela(cx,cy,r,giro);
      el.style.clipPath='path(evenodd,"'+tela+d+'")';
      halo.setAttribute("d",d);aro.setAttribute("d",d);
      var w=Math.min(5,Math.max(1.5,r*.03));
      halo.setAttribute("stroke-width",w*4);halo.style.opacity=.35*brilho;
      aro.setAttribute("stroke-width",w);aro.style.opacity=brilho;
      halo.style.filter="blur("+(w*1.5).toFixed(1)+"px)";
    }
    function roda(dur,fn,depois){
      var t0=performance.now();
      (function q(){var t=Math.min(1,(performance.now()-t0)/dur);fn(t);if(t<1)requestAnimationFrame(q);else if(depois)depois()})();
    }
    var vai=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
    var sobe=function(t){return 1-Math.pow(1-Math.min(1,t*1.6),3)}; // chega ao centro antes de crescer muito
    // raio final: o miolo da estrela (raio interno) precisa cobrir a tela inteira
    var rMax=Math.hypot(W,H)/.42*1.05;
    var cxF=W/2,cyF=H/2;
    // 1. a estrela do logo vira um recorte: por ela já se vê o site (pequena, ainda no lugar)
    roda(520,function(t){var k=vai(t);desenha(x0,y0,r0*(1+1.6*k),0,k)},function(){
      // 2. viaja ao centro e cresce até engolir a tela, girando de leve
      var lnA=Math.log(r0*2.6),lnB=Math.log(rMax);
      roda(1800,function(t){
        var k=vai(t),r=Math.exp(lnA+(lnB-lnA)*k);
        desenha(x0+(cxF-x0)*sobe(t),y0+(cyF-y0)*sobe(t),r,-72*k,1-k*k);
      },function(){
        if(svg.parentNode)svg.parentNode.removeChild(svg);
        fim();
        window.dispatchEvent(new CustomEvent("r4m:abriu"));
      });
    });
  }
  function fim(){if(el.parentNode)el.parentNode.removeChild(el);raiz.classList.remove("r4m-abrindo")}
  function tenta(){if(tempo&&pronto)sair(false)}
  addEventListener("r4m:pronto",function(){pronto=true;tenta()});
  setTimeout(function(){tempo=true;tenta()},2650);
  setTimeout(function(){pronto=true;tenta()},9000);
  el.querySelector(".pular").addEventListener("click",function(){sair(true)});
  addEventListener("keydown",function(e){if(e.key==="Escape")sair(true)});
})();
</script>
