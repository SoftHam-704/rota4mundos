<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Articles Page — Mobile</title>
<link rel="stylesheet" href="_shared.css">
<style>
    body { background: #F8FAFC; min-height: 100vh; color: #0F172A; padding-top: 0; padding-bottom: 60px; }

    .ap-header {
        position: relative;
        padding: clamp(36px, 7vw, 48px) 0 clamp(32px, 6vw, 44px);
        overflow: hidden;
        background: #061B33;
    }
    .ap-header-bg {
        position: absolute; inset: 0;
        background-image: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=1920&h=600&fit=crop&q=80');
        background-size: cover;
        background-position: center;
        opacity: 0.18;
    }
    .ap-header-overlay {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(6,27,51,0.5) 0%, rgba(6,27,51,0.9) 100%);
    }
    .ap-header-inner {
        position: relative; z-index: 1;
        text-align: center;
        padding: 0 16px;
        max-width: 720px;
        margin: 0 auto;
    }
    .ap-eyebrow {
        font-size: clamp(10px, 2.6vw, 11px);
        font-weight: 700; letter-spacing: 0.2em;
        color: #F4A261; text-transform: uppercase;
        margin: 0 0 10px;
    }
    .ap-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(2rem, 7vw, 3.6rem);
        color: #fff; line-height: 1;
        margin: 0 0 12px;
        letter-spacing: 0.03em;
    }
    .ap-sub {
        color: rgba(255,255,255,0.6);
        font-size: clamp(13px, 3.2vw, 15px);
        max-width: 440px;
        margin: 0 auto;
        padding: 0 8px;
    }
    .ap-search-wrap {
        max-width: 480px;
        margin: clamp(20px, 4vw, 28px) auto 0;
        position: relative;
        padding: 0 4px;
    }
    .ap-search-icon {
        position: absolute; left: 20px;
        top: 50%; transform: translateY(-50%);
        color: rgba(255,255,255,0.4);
        pointer-events: none;
    }
    .ap-search-input {
        width: 100%;
        padding: 14px 16px 14px 48px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.14);
        background: rgba(255,255,255,0.08);
        color: #fff;
        font-size: 15px;     /* 16+ evita zoom iOS */
        outline: none;
        font-family: Inter, sans-serif;
    }
    .ap-search-input::placeholder { color: rgba(255,255,255,0.4); }

    .ap-content {
        max-width: 1280px;
        margin: 32px auto 0;
        padding: 0 16px;
    }
    @media (min-width: 768px) {
        .ap-content { padding: 0 24px; }
    }

    .ap-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
    }
    @media (min-width: 481px) and (max-width: 767px) {
        .ap-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 768px) {
        .ap-grid {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
    }

    .ap-card {
        background: #fff;
        border-radius: 14px;
        padding: 20px;
        height: 100%;
        box-sizing: border-box;
        border: 1px solid #E2E8F0;
        display: flex; flex-direction: column;
        gap: 10px;
        transition: box-shadow 0.2s, transform 0.2s;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        opacity: 0; transform: translateY(16px);
        animation: fade-up 0.5s ease-out forwards;
    }
    .ap-card:nth-child(1) { animation-delay: 0.02s; }
    .ap-card:nth-child(2) { animation-delay: 0.08s; }
    .ap-card:nth-child(3) { animation-delay: 0.14s; }
    .ap-card:nth-child(4) { animation-delay: 0.2s; }
    .ap-card:nth-child(5) { animation-delay: 0.26s; }
    .ap-card:nth-child(6) { animation-delay: 0.32s; }
    .ap-card:hover {
        box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        transform: translateY(-2px);
    }
    @media (hover: none) {
        .ap-card:hover { transform: none; box-shadow: none; }
    }

    .ap-cat {
        display: inline-block; align-self: flex-start;
        padding: 3px 10px; border-radius: 20px;
        font-size: 11px; font-weight: 700;
        letter-spacing: 0.05em;
    }
    .ap-card h3 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(15px, 3.6vw, 16px);
        font-weight: 700;
        color: #0F172A; line-height: 1.4;
        margin: 0; flex: 1;
    }
    .ap-card p {
        font-size: 13px; color: #64748B;
        line-height: 1.55; margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .ap-card-meta {
        display: flex; align-items: center; justify-content: space-between;
        margin-top: auto; padding-top: 4px;
    }
    .ap-card-meta-left {
        display: flex; align-items: center; gap: 12px;
        color: #94A3B8; font-size: 12px;
    }
    .ap-card-meta-left span { display: inline-flex; align-items: center; gap: 4px; }

    .ap-pagination {
        display: flex; justify-content: center; flex-wrap: wrap;
        gap: 6px; margin-top: 32px;
    }
    .ap-pagination button {
        min-width: 44px; height: 44px;
        border-radius: 10px;
        font-weight: 600; font-size: 14px;
        cursor: pointer; border: none;
        background: #E2E8F0; color: #475569;
        font-family: Inter, sans-serif;
        padding: 0 14px;
    }
    .ap-pagination button.active {
        background: #061B33; color: #fff;
    }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState } = React;

const IconSearch = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
const IconCal = () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
const IconEye = () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>;
const IconArrow = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;

const CAT_COLOR = {
    Infraestrutura:  { bg: "#EEF2FF", text: "#4338CA", dot: "#6366F1" },
    Turismo:         { bg: "#ECFDF5", text: "#065F46", dot: "#10B981" },
    Economia:        { bg: "#FFF7ED", text: "#9A3412", dot: "#F97316" },
    Cultura:         { bg: "#FDF4FF", text: "#7E22CE", dot: "#A855F7" },
    "Meio Ambiente": { bg: "#F0FDF4", text: "#14532D", dot: "#22C55E" },
    Política:        { bg: "#FFF1F2", text: "#9F1239", dot: "#F43F5E" },
};

const ARTICLES = [
    { cat: "Infraestrutura", title: "Ponte sobre o Rio Paraguai entra em fase final de construção", excerpt: "Estrutura de 1.350m liga Porto Murtinho a Carmelo Peralta.", date: "12/05/2026", views: 2840 },
    { cat: "Turismo",        title: "Bonito amplia operação turística para receber o fluxo bioceânico", excerpt: "Lei de capacidade de carga é revista e novos passeios entram no sistema.", date: "08/05/2026", views: 1623 },
    { cat: "Economia",       title: "Acordo reduz tempo de fronteiras em 70%", excerpt: "Sistema digital integra aduanas do Brasil, Paraguai, Argentina e Chile.", date: "30/04/2026", views: 4112 },
    { cat: "Cultura",        title: "Festival Bioceânico reúne artistas dos 4 países", excerpt: "Programação simultânea em Campo Grande, Filadelfia, Salta e Iquique.", date: "25/04/2026", views: 980 },
    { cat: "Meio Ambiente",  title: "Estudo mapeia impactos ambientais do corredor", excerpt: "Pesquisadores avaliam corredor de fauna em 12 pontos críticos.", date: "18/04/2026", views: 1455 },
    { cat: "Política",       title: "Mercosul aprova marco logístico para a Rota", excerpt: "Acordo libera novos investimentos e padroniza certificação de cargas.", date: "10/04/2026", views: 2127 },
];

function App() {
    const [search, setSearch] = useState("");
    const [page, setPage] = useState(1);
    const filtered = ARTICLES.filter(a =>
        !search || a.title.toLowerCase().includes(search.toLowerCase()) || a.excerpt.toLowerCase().includes(search.toLowerCase())
    );

    return (
        <React.Fragment>
            <div className="ap-header">
                <div className="ap-header-bg"/>
                <div className="ap-header-overlay"/>
                <div className="ap-header-inner">
                    <p className="ap-eyebrow">IRIS — Monitoramento em Tempo Real</p>
                    <h1 className="ap-title">Notícias da Rota</h1>
                    <p className="ap-sub">Acompanhe as últimas novidades sobre o Corredor Bioceânico</p>

                    <div className="ap-search-wrap">
                        <span className="ap-search-icon"><IconSearch/></span>
                        <input
                            className="ap-search-input"
                            type="text"
                            value={search}
                            onChange={e => setSearch(e.target.value)}
                            placeholder="Buscar artigos..."
                        />
                    </div>
                </div>
            </div>

            <div className="ap-content">
                <div className="ap-grid">
                    {filtered.map((a, i) => {
                        const c = CAT_COLOR[a.cat] || CAT_COLOR.Infraestrutura;
                        return (
                            <a key={i} className="ap-card" href="#"
                               style={{ borderLeft: `4px solid ${c.dot}` }}>
                                <span className="ap-cat" style={{ background: c.bg, color: c.text }}>{a.cat}</span>
                                <h3>{a.title}</h3>
                                <p>{a.excerpt}</p>
                                <div className="ap-card-meta">
                                    <div className="ap-card-meta-left">
                                        <span><IconCal/> {a.date}</span>
                                        <span><IconEye/> {a.views}</span>
                                    </div>
                                    <span style={{ color: c.dot, display: "inline-flex" }}><IconArrow/></span>
                                </div>
                            </a>
                        );
                    })}
                </div>

                <div className="ap-pagination">
                    {[1,2,3,4].map(n => (
                        <button key={n} className={n === page ? "active" : ""} onClick={() => setPage(n)}>{n}</button>
                    ))}
                </div>
            </div>
        </React.Fragment>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
