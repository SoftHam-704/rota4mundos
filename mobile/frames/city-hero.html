<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Hero — Mobile</title>
<link rel="stylesheet" href="_shared.css">
<style>
    body { background: #061B33; min-height: 100vh; }

    .city-hero {
        position: relative;
        min-height: min(720px, 100svh);
        width: 100%;
        overflow: hidden;
        background-color: #061B33;
    }
    @media (min-width: 768px) {
        .city-hero { min-height: 100vh; }
    }

    .city-hero-bg {
        position: absolute; inset: 0;
    }
    .city-hero-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        animation: city-hero-img-in 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (min-width: 768px) {
        .city-hero-bg img {
            height: 115%;
            animation: city-hero-img-in-desk 2.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
    }
    @keyframes city-hero-img-in {
        from { opacity: 0; }
        to   { opacity: 1; }
    }
    @keyframes city-hero-img-in-desk {
        from { opacity: 0; transform: scale(1.04); }
        to   { opacity: 1; transform: scale(1); }
    }

    .city-grad-1, .city-grad-2, .city-grad-3, .city-grain {
        position: absolute; inset: 0; pointer-events: none;
    }
    .city-grad-1 {
        background: linear-gradient(180deg, rgba(5,8,20,0.55) 0%, rgba(5,8,20,0.15) 30%, rgba(5,8,20,0.55) 75%, rgba(5,8,20,0.92) 100%);
    }
    .city-grad-2 {
        background: radial-gradient(ellipse at 30% 60%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 100%);
    }
    .city-grad-3 {
        mix-blend-mode: overlay; opacity: 0.4;
    }
    .city-grain {
        opacity: 0.08; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.6'/></svg>");
    }

    .city-hero-content {
        position: relative; z-index: 10;
        max-width: 80rem;
        margin: 0 auto;
        padding: 72px 20px 96px;
    }
    @media (min-width: 768px) {
        .city-hero-content { padding: 80px 24px 120px; }
    }

    .city-badge {
        display: flex; align-items: center; gap: 10px;
        font-size: clamp(10px, 2.6vw, 12px);
        text-transform: uppercase;
        letter-spacing: 0.22em;
        text-shadow: 0 2px 12px rgba(0,0,0,0.6);
        font-weight: 700;
        flex-wrap: wrap;
        animation: fade-up 0.7s ease-out 0.3s both;
    }
    .city-badge .flag {
        font-size: clamp(22px, 5.6vw, 26px);
    }

    .city-h1 {
        margin: 16px 0 0;
        line-height: 0.92;
        text-shadow: 0 6px 40px rgba(0,0,0,0.55);
    }
    .city-h1 .first, .city-h1 .second {
        display: block;
        font-size: clamp(2.6rem, 13vw, 9rem);
        font-weight: 700;
        font-family: 'Playfair Display', serif;
    }
    .city-h1 .first {
        color: #fff;
        animation: city-name-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
    }
    .city-h1 .second {
        animation: city-name-in-x 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both;
    }
    @keyframes city-name-in {
        from { opacity: 0; transform: translateY(40px); filter: blur(12px); }
        to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
    }
    @keyframes city-name-in-x {
        from { opacity: 0; transform: translateX(-60px); filter: blur(12px); }
        to   { opacity: 1; transform: translateX(0);    filter: blur(0); }
    }

    .city-tagline {
        margin: 20px 0 0;
        max-width: 640px;
        font-size: clamp(0.95rem, 3vw, 1.2rem);
        font-style: italic;
        color: rgba(255,255,255,0.9);
        font-family: 'Playfair Display', serif;
        text-shadow: 0 2px 16px rgba(0,0,0,0.6);
        line-height: 1.5;
        animation: fade-up 0.8s ease-out 1.1s both;
    }

    .city-stats {
        margin-top: 36px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        max-width: 680px;
        animation: fade-up 0.8s ease-out 1.3s both;
    }
    @media (min-width: 481px) {
        .city-stats {
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 48px;
        }
    }
    .city-stat {
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(12px);
        padding: 14px 16px;
    }
    .city-stat-val {
        font-size: clamp(1.25rem, 5.4vw, 1.875rem);
        font-weight: 700; color: #fff;
        font-variant-numeric: tabular-nums;
        line-height: 1;
    }
    .city-stat-label {
        margin-top: 6px;
        font-size: clamp(9px, 2.4vw, 10px);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: rgba(255,255,255,0.6);
        font-weight: 600;
    }

    .city-scroll-cue {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        z-index: 10;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        font-size: 9px; text-transform: uppercase; letter-spacing: 0.3em;
        color: rgba(255,255,255,0.6); font-weight: 600;
        animation: fade-up 0.6s ease-out 1.8s both;
    }
    .city-scroll-cue .arrow {
        animation: float-y 1.8s ease-in-out infinite;
    }

    .after-city {
        padding: 64px 18px;
        background: linear-gradient(180deg, #061B33 0%, #0a2540 100%);
    }
    .after-city h3 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(1.6rem, 6vw, 2.4rem);
        color: #fff; margin: 0 0 12px;
        letter-spacing: 0.04em;
    }
    .after-city p {
        color: rgba(255,255,255,0.55); font-size: 14px;
        line-height: 1.7;
    }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useEffect, useRef, useState } = React;

const IconChevronDown = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><polyline points="6 9 12 15 18 9"/></svg>;

function CountUp({ to, prefix = "", suffix = "" }) {
    const ref = useRef(null);
    const [v, setV] = useState(0);
    useEffect(() => {
        let start = null;
        const dur = 1600;
        const tick = (t) => {
            if (start === null) start = t;
            const p = Math.min(1, (t - start) / dur);
            const eased = 1 - Math.pow(1 - p, 3);
            setV(Math.round(to * eased));
            if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
    }, [to]);
    return <span>{prefix}{v.toLocaleString("pt-BR")}{suffix}</span>;
}

function App() {
    const accent = "#ff9a4d";
    const stats = [
        { value: 906, suffix: ".000",   label: "habitantes" },
        { value: 8,                    label: "atrações principais" },
        { value: 22,  prefix: "R$ ",  suffix: " bi",    label: "PIB municipal" },
        { value: 1899,                 label: "fundação" },
    ];

    return (
        <React.Fragment>
        <section className="city-hero">
            <div className="city-hero-bg">
                <img src="https://images.unsplash.com/photo-1583398701474-d4c1f56e29eb?w=1920&h=1200&fit=crop&q=80" alt=""/>
            </div>

            <div className="city-grad-1"/>
            <div className="city-grad-2"/>
            <div className="city-grad-3" style={{ background: `radial-gradient(circle at 70% 30%, ${accent}, transparent 55%)` }}/>
            <div className="city-grain"/>

            <div className="city-hero-content">
                <div className="city-badge" style={{ color: accent }}>
                    <span className="flag">🇧🇷</span>
                    <span>Brasil · Capital do Estado</span>
                </div>

                <h1 className="city-h1">
                    <span className="first">Campo</span>
                    <span className="second" style={{ color: accent }}>Grande</span>
                </h1>

                <p className="city-tagline">
                    A Capital Morena do Cerrado — onde o Pantanal encontra a cidade e o céu se abre para o oeste.
                </p>

                <div className="city-stats">
                    {stats.map((s, i) => (
                        <div className="city-stat" key={i}>
                            <div className="city-stat-val">
                                <CountUp to={s.value} prefix={s.prefix} suffix={s.suffix}/>
                            </div>
                            <div className="city-stat-label">{s.label}</div>
                        </div>
                    ))}
                </div>
            </div>

            <div className="city-scroll-cue">
                <span>role para descobrir</span>
                <span className="arrow"><IconChevronDown/></span>
            </div>
        </section>

        <div className="after-city">
            <h3>Próxima seção (Sobre a Cidade)</h3>
            <p>No mobile, o parallax do scroll e o "Ken Burns" da imagem foram desligados — a imagem fica fixa e a hierarquia segue intacta. As animações de entrada (nome, tagline, stats) continuam, mas com durations menores (0.8–0.9s em vez de 1.1–1.2s).</p>
            <p style={{ marginTop: 16 }}>Stats viram um grid de 2 colunas até 480px e auto-fit a partir daí.</p>
        </div>
        </React.Fragment>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
