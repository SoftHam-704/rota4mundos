<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Articles Home — Mobile</title>
<link rel="stylesheet" href="_shared.css">
<style>
    body { background: #020d1a; min-height: 100vh; }

    .articles-hero {
        position: relative;
        width: 100%;
        height: clamp(220px, 35vw, 420px);
        overflow: hidden;
    }
    .articles-hero img {
        width: 100%; height: 100%;
        object-fit: cover; object-position: center;
        display: block;
        animation: fade-up 1s ease-out;
    }
    .articles-hero::before {
        content: ""; position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 55%;
        background: linear-gradient(to bottom, transparent, #020d1a);
        pointer-events: none;
        z-index: 2;
    }
    .articles-hero-text {
        position: absolute; left: 0; right: 0; bottom: 8%;
        z-index: 3;
        text-align: center;
        padding: 0 20px;
    }
    .articles-hero-text .eyebrow {
        font-size: clamp(9px, 2.4vw, 11px);
        font-weight: 700; letter-spacing: 0.2em;
        color: #F4A261; text-transform: uppercase;
        margin-bottom: 8px;
    }
    .articles-hero-text h2 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(1.8rem, 6.5vw, 3.4rem);
        color: #fff;
        letter-spacing: 0.04em; line-height: 1;
        margin: 0;
        text-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }

    .articles-wrap {
        padding: 24px 16px 60px;
        max-width: 1280px;
        margin: 0 auto;
        position: relative;
    }
    @media (min-width: 768px) {
        .articles-wrap { padding: 24px 24px 80px; }
    }

    .articles-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        align-items: stretch;
    }
    @media (min-width: 481px) and (max-width: 767px) {
        .articles-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 768px) {
        .articles-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }

    .article-card {
        display: flex; flex-direction: column;
        text-decoration: none; position: relative;
        border-radius: 18px; overflow: hidden;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.07);
        backdrop-filter: blur(16px);
        height: 100%;
        opacity: 0; transform: translateY(20px);
        animation: fade-up 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
    }
    .article-card:nth-child(1) { animation-delay: 0.05s; }
    .article-card:nth-child(2) { animation-delay: 0.15s; }
    .article-card:nth-child(3) { animation-delay: 0.25s; }

    .article-card:hover {
        border-color: rgba(255,255,255,0.14);
        transform: translateY(-5px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    @media (hover: none) {
        .article-card:hover { transform: none; box-shadow: none; }
    }

    .article-card-img {
        position: relative;
        height: clamp(150px, 38vw, 180px);
        flex-shrink: 0;
        overflow: hidden;
    }
    .article-card-img img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.6s ease;
    }
    .article-card:hover .article-card-img img { transform: scale(1.06); }
    @media (hover: none) {
        .article-card:hover .article-card-img img { transform: none; }
    }
    .article-card-img::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(2,13,26,0.25) 0%, rgba(2,13,26,0.72) 100%);
        pointer-events: none;
    }
    .article-card-cat {
        position: absolute; bottom: 12px; left: 14px;
        font-size: 9px; font-weight: 700; color: #fff;
        backdrop-filter: blur(8px);
        padding: 3px 10px; border-radius: 100px;
        letter-spacing: 0.1em; text-transform: uppercase;
        z-index: 2;
    }

    .article-card-body {
        padding: 18px 18px 22px;
        display: flex; flex-direction: column; flex: 1;
        position: relative; z-index: 2;
    }
    .article-meta {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 10px; flex-wrap: wrap;
        font-size: 10px; color: rgba(255,255,255,0.3);
    }
    .article-meta span { display: inline-flex; align-items: center; gap: 4px; }

    .article-card h3 {
        font-size: clamp(13px, 3.6vw, 14px);
        font-weight: 700;
        color: rgba(255,255,255,0.9);
        line-height: 1.5;
        margin: 0 0 10px;
        flex: 1;
    }
    .article-card p {
        font-size: 12px;
        color: rgba(255,255,255,0.4);
        line-height: 1.65;
        margin: 0 0 14px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .article-card-cta {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 11px; font-weight: 700;
        letter-spacing: 0.08em; text-transform: uppercase;
    }

    .ver-todas-wrap { display: flex; justify-content: center; margin-top: 32px; }
    .ver-todas-link {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 12px; font-weight: 700; color: #2A9D8F;
        text-decoration: none;
        letter-spacing: 0.08em; text-transform: uppercase;
        border: 1px solid rgba(42,157,143,0.3);
        padding: 10px 22px; border-radius: 100px;
        backdrop-filter: blur(8px);
        transition: all 0.3s ease;
    }
    .ver-todas-link:hover { border-color: rgba(42,157,143,0.6); color: #4bc9b8; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const IconCal = () => <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
const IconClock = () => <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
const IconArrow = ({size=11}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;

const ARTICLES = [
    {
        cat: "Infraestrutura", color: "#F4A261", rgb: "244,162,97",
        title: "Ponte sobre o Rio Paraguai entra em fase final de construção",
        excerpt: "Estrutura de 1.350m liga Porto Murtinho a Carmelo Peralta e marca um capítulo histórico da integração entre Brasil e Paraguai.",
        date: "12 mai 2026", read: "4 min",
        img: "https://images.unsplash.com/photo-1541888946425-d81bb19240f5?w=600&h=300&fit=crop&q=80",
    },
    {
        cat: "Turismo", color: "#2A9D8F", rgb: "42,157,143",
        title: "Bonito amplia operação turística para receber o fluxo bioceânico",
        excerpt: "Lei de capacidade de carga é revista e novos passeios entram no sistema centralizado de vouchers do município.",
        date: "08 mai 2026", read: "6 min",
        img: "https://images.unsplash.com/photo-1546026423-cc4642628d2b?w=600&h=300&fit=crop&q=80",
    },
    {
        cat: "Economia", color: "#818cf8", rgb: "129,140,248",
        title: "Acordo entre os 4 países reduz tempo de cruzamento de fronteiras em 70%",
        excerpt: "Sistema digital de cargas e passagens integra aduanas do Brasil, Paraguai, Argentina e Chile em operação 24h.",
        date: "30 abr 2026", read: "5 min",
        img: "https://images.unsplash.com/photo-1494412574643-ff11b0a5c1c3?w=600&h=300&fit=crop&q=80",
    },
];

function App() {
    return (
        <section>
            <div className="articles-hero">
                <img src="https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=1920&h=600&fit=crop&q=80" alt=""/>
                <div className="articles-hero-text">
                    <div className="eyebrow">Últimas atualizações</div>
                    <h2>Notícias da Rota</h2>
                </div>
            </div>

            <div className="articles-wrap">
                <div className="articles-grid">
                    {ARTICLES.map((a, i) => (
                        <a key={i} className="article-card" href="#">
                            <div className="article-card-img">
                                <img src={a.img} alt={a.cat}/>
                                <span className="article-card-cat" style={{
                                    background: `rgba(${a.rgb},0.25)`,
                                    border: `1px solid rgba(${a.rgb},0.35)`,
                                }}>{a.cat}</span>
                            </div>
                            <div className="article-card-body">
                                <div className="article-meta">
                                    <span><IconCal/> {a.date}</span>
                                    <span><IconClock/> {a.read}</span>
                                </div>
                                <h3>{a.title}</h3>
                                <p>{a.excerpt}</p>
                                <span className="article-card-cta" style={{ color: a.color }}>
                                    Ler mais <IconArrow/>
                                </span>
                            </div>
                        </a>
                    ))}
                </div>

                <div className="ver-todas-wrap">
                    <a className="ver-todas-link" href="#">
                        Ver todas as notícias <IconArrow size={13}/>
                    </a>
                </div>
            </div>
        </section>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
