<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero — Mobile</title>
<link rel="stylesheet" href="_shared.css">
<style>
    body { background: #020d1a; min-height: 100vh; }

    .hero-wrap {
        position: relative;
        width: 100%;
        min-height: 100svh;
        overflow: hidden;
        display: flex; align-items: center;
        background: #020d1a;
    }
    .hero-bg {
        position: absolute; inset: -8% 0; z-index: 0;
    }
    .hero-bg video, .hero-bg img {
        width: 100%; height: 100%;
        object-fit: cover;
        filter: brightness(0.52) saturate(1.3) contrast(1.05);
    }
    /* sun glow */
    .sun-glow {
        position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden;
    }
    .sun-glow::before {
        content: ""; position: absolute;
        top: 18%; left: 52%; transform: translateX(-50%);
        width: min(320px, 70%); height: 320px;
        background: radial-gradient(circle, rgba(244,162,97,0.28) 0%, rgba(233,196,106,0.14) 30%, rgba(231,111,81,0.06) 60%, transparent 80%);
        filter: blur(24px);
        animation: glow-pulse 6s ease-in-out infinite;
    }
    .sun-glow::after {
        content: ""; position: absolute;
        top: 22%; left: 52%; transform: translateX(-50%);
        width: 100px; height: 100px;
        background: radial-gradient(circle, rgba(255,220,150,0.45) 0%, rgba(244,162,97,0.25) 50%, transparent 80%);
        filter: blur(8px);
        animation: glow-pulse 4s ease-in-out infinite 0.5s;
    }

    .hero-overlay-1 {
        position: absolute; inset: 0; z-index: 3; pointer-events: none;
        background: linear-gradient(180deg, rgba(2,13,26,0.72) 0%, rgba(2,13,26,0) 28%, rgba(2,13,26,0) 55%, rgba(2,13,26,0.96) 100%);
    }
    .hero-overlay-2 {
        position: absolute; inset: 0; z-index: 3; pointer-events: none;
        background: linear-gradient(100deg, rgba(2,13,26,0.82) 0%, rgba(2,13,26,0.45) 45%, rgba(2,13,26,0) 75%);
    }

    .hero-content {
        position: relative; z-index: 20;
        width: 100%;
        padding: clamp(96px, 16vh, 150px) 0 32px;
    }
    .hero-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: center;
        min-height: calc(100svh - 140px);
    }
    @media (min-width: 768px) {
        .hero-grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 48px; }
    }
    @media (max-width: 767px) {
        .hero-right-col { display: none !important; }
    }

    .hero-badge {
        display: inline-flex; align-items: center; gap: 10px;
        margin-bottom: clamp(14px, 2.5vh, 28px);
        padding: 6px 14px;
        border-radius: 100px;
        background: rgba(244,162,97,0.1);
        border: 1px solid rgba(244,162,97,0.28);
        backdrop-filter: blur(12px);
        animation: fade-up 0.6s ease-out;
    }
    .hero-badge-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #F4A261;
        box-shadow: 0 0 10px rgba(244,162,97,0.9);
        animation: pulse-dot 2s ease-in-out infinite;
    }
    .hero-badge-text {
        font-size: clamp(9px, 2.4vw, 10px);
        font-weight: 700;
        color: #F4A261;
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    .hero-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: var(--fs-hero-title);
        color: #F8FAFC;
        line-height: 0.92;
        letter-spacing: 0.03em;
        margin: 0;
    }
    .hero-title-2 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: var(--fs-hero-title);
        line-height: 0.92;
        letter-spacing: 0.03em;
        margin: 0;
        display: block;
    }
    .hero-title-wrap {
        margin-bottom: clamp(12px, 2vh, 24px);
        overflow: hidden;
        height: clamp(2.6rem, 10vw, 6.9rem);
    }

    .hero-sub {
        font-family: 'Lora', Georgia, serif;
        font-size: clamp(0.92rem, 2.6vw, 1.15rem);
        font-style: italic;
        color: rgba(255,255,255,0.6);
        line-height: 1.7;
        max-width: 480px;
        margin: 0 0 clamp(20px, 3vh, 36px);
    }

    .hero-ctas {
        display: flex; gap: 10px; flex-wrap: wrap;
        margin-bottom: clamp(20px, 4vh, 52px);
    }
    .hero-ctas .btn-amber,
    .hero-ctas .btn-ghost {
        font-size: clamp(12px, 3vw, 13px);
        padding: clamp(11px, 2.4vw, 13px) clamp(20px, 5vw, 28px);
    }

    /* Stats */
    .hero-stats {
        display: flex; gap: 0;
        border-top: 1px solid rgba(255,255,255,0.08);
        padding-top: clamp(14px, 2.5vh, 28px);
    }
    .hero-stat {
        flex: 1; text-align: center;
        padding-right: clamp(10px, 3vw, 20px);
        padding-left: 0;
        border-right: 1px solid rgba(255,255,255,0.08);
    }
    .hero-stat:nth-child(2) { padding-left: clamp(10px, 3vw, 20px); }
    .hero-stat:last-child {
        padding-right: 0;
        padding-left: clamp(10px, 3vw, 20px);
        border-right: none;
    }
    .hero-stat-value {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(1.5rem, 6.5vw, 2.1rem);
        line-height: 1;
        letter-spacing: 0.04em;
    }
    .hero-stat-label {
        font-size: clamp(9px, 2.4vw, 10px);
        color: rgba(255,255,255,0.4);
        letter-spacing: 0.06em;
        margin-top: 4px;
    }

    /* Inline podcast (desktop) */
    .hero-podcast-inline {
        margin-bottom: clamp(18px, 3vh, 32px);
    }
    @media (max-width: 767px) {
        .hero-podcast-inline { display: none; }
    }

    .podcast-pill {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 16px;
        border-radius: 100px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(12px);
        max-width: 320px;
    }
    .podcast-btn {
        width: 34px; height: 34px; border-radius: 50%;
        background: linear-gradient(135deg, #F4A261, #E9C46A);
        border: none; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 0 16px rgba(244,162,97,0.4);
        color: #061B33;
    }
    .podcast-info { flex: 1; min-width: 0; }
    .podcast-label {
        display: flex; align-items: center; gap: 6px;
        font-size: 11px; font-weight: 700;
        color: rgba(255,255,255,0.85);
        margin-bottom: 5px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .podcast-bar {
        height: 3px; border-radius: 4px;
        background: rgba(255,255,255,0.1);
        position: relative; overflow: hidden;
    }
    .podcast-bar-fill {
        height: 100%; width: 35%;
        background: linear-gradient(90deg, #F4A261, #E9C46A);
        border-radius: 4px;
    }

    /* Mini-player flutuante (mobile) */
    .podcast-floating {
        position: fixed;
        right: 12px; bottom: 12px;
        z-index: 40;
        animation: fade-up 0.4s ease-out;
    }
    .podcast-floating .podcast-pill {
        padding: 10px 12px 10px 10px;
        background: rgba(6,27,51,0.92);
        border-color: rgba(244,162,97,0.4);
        max-width: 280px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .podcast-close {
        width: 26px; height: 26px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.6);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; flex-shrink: 0;
    }
    @media (min-width: 768px) { .podcast-floating { display: none !important; } }

    /* Scroll cue */
    .scroll-cue {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        z-index: 22;
        display: flex; flex-direction: column; align-items: center; gap: 5px;
        cursor: pointer;
    }
    .scroll-cue-text {
        font-size: 8px;
        color: rgba(255,255,255,0.22);
        letter-spacing: 0.25em;
        text-transform: uppercase;
    }
    .scroll-cue-arrow {
        animation: float-y 1.6s ease-in-out infinite;
        color: rgba(244,162,97,0.5);
    }

    /* Bottom blend */
    .hero-blend {
        position: absolute; bottom: 0; left: 0; right: 0;
        height: 100px; z-index: 15;
        background: linear-gradient(to bottom, transparent, #061B33);
        pointer-events: none;
    }

    /* Right column cards (desktop only) */
    .hero-right-col {
        display: flex; flex-direction: column; gap: 20px;
        animation: fade-up 1s ease-out 0.4s both;
    }

    /* Fake content after hero, p/ habilitar trigger do floating */
    .after-hero {
        padding: 80px 18px 100px;
        background: #061B33;
        min-height: 60vh;
    }
    .after-hero h3 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(1.6rem, 6vw, 2.4rem);
        letter-spacing: 0.04em;
        margin: 0 0 12px;
        color: #fff;
    }
    .after-hero p {
        color: rgba(255,255,255,0.5);
        font-size: 14px; line-height: 1.7;
    }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const IconArrowRight = ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
const IconChevronDown = ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><polyline points="6 9 12 15 18 9"/></svg>;
const IconPlay = ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
const IconPause = ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
const IconHeadphones = ({size=11}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>;
const IconX = ({size=12}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;

function useMediaQuery(query) {
    const [matches, setMatches] = useState(() => window.matchMedia(query).matches);
    useEffect(() => {
        const mq = window.matchMedia(query);
        const h = (e) => setMatches(e.matches);
        mq.addEventListener("change", h);
        setMatches(mq.matches);
        return () => mq.removeEventListener("change", h);
    }, [query]);
    return matches;
}

function PodcastPill({ floating, onClose }) {
    const [playing, setPlaying] = useState(false);
    return (
        <div className="podcast-pill">
            <button className="podcast-btn" onClick={() => setPlaying(p => !p)}>
                {playing ? <IconPause/> : <IconPlay/>}
            </button>
            <div className="podcast-info">
                <div className="podcast-label">
                    <span style={{color: "#F4A261", display: "inline-flex"}}><IconHeadphones/></span>
                    {playing ? "Reproduzindo..." : "Ouça o Podcast"}
                </div>
                <div className="podcast-bar"><div className="podcast-bar-fill" style={{ width: playing ? "62%" : "35%" }}/></div>
            </div>
            {floating && (
                <button className="podcast-close" onClick={onClose} aria-label="Fechar"><IconX/></button>
            )}
        </div>
    );
}

const WORDS = ["DOIS OCEANOS", "UMA HISTÓRIA", "UM FUTURO"];

function RouteMap() {
    const cities = [
        { x: 48, y: 62, label: "Campo Grande", sub: "🇧🇷", color: "#22c55e", above: true },
        { x: 160, y: 72, label: "Porto Murtinho", sub: "🇧🇷", color: "#4ade80", above: false },
        { x: 275, y: 54, label: "Carmelo Peralta", sub: "🇵🇾", color: "#2dd4bf", above: true },
        { x: 390, y: 46, label: "Resistencia", sub: "🇦🇷", color: "#60a5fa", above: false },
        { x: 505, y: 58, label: "Mendoza", sub: "🇦🇷", color: "#818cf8", above: true },
        { x: 620, y: 48, label: "Iquique", sub: "🇨🇱", color: "#f87171", above: false },
    ];
    return (
        <svg viewBox="0 0 680 135" width="100%" style={{overflow:"visible",display:"block"}}>
            <defs>
                <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stopColor="#22c55e"/>
                    <stop offset="30%" stopColor="#2dd4bf"/>
                    <stop offset="65%" stopColor="#60a5fa"/>
                    <stop offset="100%" stopColor="#f87171"/>
                </linearGradient>
                <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <path d="M48,62 Q100,48 160,72 Q215,82 275,54 Q330,32 390,46 Q448,60 505,58 Q560,48 620,48" fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="3" strokeLinecap="round"/>
            <path d="M48,62 Q100,48 160,72 Q215,82 275,54 Q330,32 390,46 Q448,60 505,58 Q560,48 620,48" fill="none" stroke="url(#rg)" strokeWidth="2.5" strokeLinecap="round" filter="url(#glow)" style={{ strokeDasharray: 900, strokeDashoffset: 900, animation: "route-draw 2.8s cubic-bezier(.4,0,.2,1) forwards 1.2s" }}/>
            {cities.map((c, i) => (
                <g key={i}>
                    <circle cx={c.x} cy={c.y} r={5} fill={c.color} filter="url(#glow)"/>
                    <circle cx={c.x} cy={c.y} r={2.5} fill="white"/>
                    <text x={c.x} y={c.above ? c.y - 12 : c.y + 18} textAnchor="middle" fill="rgba(255,255,255,0.92)" fontSize="10" fontWeight="700">{c.label}</text>
                </g>
            ))}
        </svg>
    );
}

function App() {
    const [wordIdx, setWordIdx] = useState(0);
    const isMobile = useMediaQuery("(max-width: 767px)");
    const [floatingVisible, setFloatingVisible] = useState(false);
    const [floatingDismissed, setFloatingDismissed] = useState(false);

    useEffect(() => {
        const iv = setInterval(() => setWordIdx(i => (i + 1) % WORDS.length), 3400);
        return () => clearInterval(iv);
    }, []);

    useEffect(() => {
        if (!isMobile) { setFloatingVisible(false); return; }
        const onScroll = () => {
            const y = window.scrollY;
            setFloatingVisible(y > window.innerHeight * 0.4 && y < window.innerHeight * 6);
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
    }, [isMobile]);

    return (
        <React.Fragment>
        <section className="hero-wrap">
            <div className="hero-bg">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1920&h=1080&fit=crop&auto=format&q=80" alt=""/>
            </div>
            <div className="sun-glow"/>
            <div className="hero-overlay-1"/>
            <div className="hero-overlay-2"/>

            <div className="hero-content">
                <div className="container-rota">
                    <div className="hero-grid">
                        {/* Coluna esquerda */}
                        <div>
                            <div className="hero-badge">
                                <span className="hero-badge-dot"/>
                                <span className="hero-badge-text">Rota Bioceânica · 4 Países · 3.500 km</span>
                            </div>

                            <h1 className="hero-title" style={{ animation: "fade-up 0.75s ease-out 0.35s both" }}>A PONTE ENTRE</h1>

                            <div className="hero-title-wrap">
                                <h1 key={wordIdx} className="hero-title-2 hero-title-gradient"
                                    style={{ animation: "fade-up 0.55s cubic-bezier(.16,1,.3,1) both" }}>
                                    {WORDS[wordIdx]}
                                </h1>
                            </div>

                            <p className="hero-sub" style={{ animation: "fade-up 0.7s ease-out 0.7s both" }}>
                                Do Pantanal ao Pacífico — a maior integração continental da América do Sul, unindo culturas, povos e mercados em 3.500 km de história viva.
                            </p>

                            <div className="hero-ctas" style={{ animation: "fade-up 0.7s ease-out 0.85s both" }}>
                                <a className="btn-amber" href="#">Explorar Cidades <IconArrowRight size={14}/></a>
                                <a className="btn-ghost" href="#">Conheça a Rota</a>
                            </div>

                            <div className="hero-podcast-inline" style={{ animation: "fade-up 0.7s ease-out 0.95s both" }}>
                                <PodcastPill/>
                            </div>

                            <div className="hero-stats" style={{ animation: "fade-up 0.7s ease-out 1.05s both" }}>
                                {[
                                    { value: "3.500km", label: "extensão total", color: "#F4A261" },
                                    { value: "4",      label: "países integrados", color: "#2dd4bf" },
                                    { value: "12",     label: "cidades na rota", color: "#60a5fa" },
                                ].map((s, i) => (
                                    <div className="hero-stat" key={i}>
                                        <div className="hero-stat-value" style={{ color: s.color }}>{s.value}</div>
                                        <div className="hero-stat-label">{s.label}</div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Coluna direita — escondida no mobile */}
                        <div className="hero-right-col">
                            <div className="glass-card-amber" style={{ padding: "28px 24px", textAlign: "center" }}>
                                <p style={{ fontSize: 10, fontWeight: 700, color: "rgba(255,255,255,0.35)", letterSpacing: "0.2em", textTransform: "uppercase", marginBottom: 16, marginTop: 0 }}>
                                    Os 4 países da rota
                                </p>
                                <div style={{ display: "flex", justifyContent: "center", gap: 14 }}>
                                    {[["🇧🇷","BR","#2A9D8F"],["🇵🇾","PY","#a78bfa"],["🇦🇷","AR","#fb923c"],["🇨🇱","CL","#38bdf8"]].map(([flag,code,color],i)=>(
                                        <div key={i} style={{
                                            width: 50, height: 50, borderRadius: "50%",
                                            border: `2px solid ${color}`,
                                            display: "flex", alignItems: "center", justifyContent: "center",
                                            fontSize: 24,
                                            background: `${color}1a`,
                                        }}>{flag}</div>
                                    ))}
                                </div>
                            </div>

                            <div className="glass-card" style={{ padding: "24px 20px" }}>
                                <p style={{ fontSize: 10, fontWeight: 700, color: "rgba(255,255,255,0.35)", letterSpacing: "0.2em", textTransform: "uppercase", marginBottom: 14, marginTop: 0 }}>
                                    Traçado da rota — Atlântico → Pacífico
                                </p>
                                <RouteMap/>
                            </div>

                            <div style={{
                                background: "linear-gradient(135deg, rgba(244,162,97,0.12), rgba(233,196,106,0.06))",
                                border: "1px solid rgba(244,162,97,0.2)",
                                borderRadius: 16, padding: "20px 22px",
                                display: "flex", alignItems: "center", gap: 16,
                            }}>
                                <div style={{ width: 44, height: 44, borderRadius: 12, background: "rgba(244,162,97,0.15)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>🏆</div>
                                <div>
                                    <div style={{ fontSize: 12, fontWeight: 700, color: "#F4A261", marginBottom: 3 }}>Reconhecimento UNESCO</div>
                                    <div style={{ fontSize: 11, color: "rgba(255,255,255,0.4)", lineHeight: 1.5 }}>Patrimônio cultural e natural reconhecido internacionalmente ao longo do corredor</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div className="scroll-cue" style={{ animation: "fade-up 0.6s ease-out 2.2s both" }}>
                <span className="scroll-cue-text">descobrir</span>
                <span className="scroll-cue-arrow"><IconChevronDown/></span>
            </div>

            <div className="hero-blend"/>
        </section>

        <div className="after-hero">
            <h3>Próxima seção</h3>
            <p>Role para baixo no mobile (&lt; 768px) para ver o <strong style={{ color: "#F4A261" }}>mini-player flutuante</strong> aparecer no canto inferior direito.</p>
            <p style={{ marginTop: 20 }}>O player toca o podcast da rota e pode ser fechado. Hit-target: 36×36 px para o botão play, 26×26 px para fechar.</p>
        </div>

        {/* mini-player flutuante (mobile only) */}
        {isMobile && floatingVisible && !floatingDismissed && (
            <div className="podcast-floating">
                <PodcastPill floating onClose={() => setFloatingDismissed(true)}/>
            </div>
        )}
        </React.Fragment>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
