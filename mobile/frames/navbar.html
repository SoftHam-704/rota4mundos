<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Navbar — Mobile</title>
<link rel="stylesheet" href="_shared.css">
<style>
    body {
        background: linear-gradient(180deg, #061B33 0%, #061B33 200px, #0a2540 400px, #0e3050 600px);
        min-height: 200vh;
    }
    /* fake page content para mostrar o navbar fixo em movimento */
    .fake-content {
        padding: 110px 18px 60px;
    }
    .fake-content h2 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(2rem, 8vw, 3rem);
        letter-spacing: 0.04em;
        margin: 0 0 12px;
        color: #fff;
    }
    .fake-content p {
        font-family: 'Inter', sans-serif;
        color: rgba(255,255,255,0.5);
        font-size: 14px;
        line-height: 1.7;
    }
    .scroll-hint {
        position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
        z-index: 60; pointer-events: none;
        font-size: 10px; color: rgba(244,162,97,0.5);
        letter-spacing: 0.15em; text-transform: uppercase;
        font-family: Inter, sans-serif;
        animation: float-y 1.6s ease-in-out infinite;
    }
</style>
</head>
<body>
<div id="root"></div>
<div class="scroll-hint">↓ role para ver opaque state</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const NAV_LINKS = [
    { to: "/",         label: "Home" },
    { to: "/cidades",  label: "Destinos" },
    { to: "/noticias", label: "Notícias" },
    { to: "/apoie",    label: "Apoie" },
];

// inline icons (sem lucide)
const IconMenu = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
const IconX = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
const IconUser = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;

function Navbar() {
    const [isScrolled, setIsScrolled] = useState(false);
    const [isMobileOpen, setIsMobileOpen] = useState(false);
    const [activePath, setActivePath] = useState("/");

    useEffect(() => {
        const onScroll = () => setIsScrolled(window.scrollY > 50);
        window.addEventListener("scroll", onScroll);
        return () => window.removeEventListener("scroll", onScroll);
    }, []);

    useEffect(() => {
        document.body.style.overflow = isMobileOpen ? "hidden" : "";
        return () => { document.body.style.overflow = ""; };
    }, [isMobileOpen]);

    const opaque = isScrolled || isMobileOpen;

    return (
        <nav style={{
            position: "fixed", top: 0, left: 0, right: 0, zIndex: 50,
            transition: "background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease",
            background: opaque ? "rgba(6,27,51,0.97)" : "transparent",
            backdropFilter: opaque ? "blur(20px)" : "none",
            borderBottom: opaque ? "1px solid rgba(255,255,255,0.07)" : "1px solid transparent",
            boxShadow: opaque ? "0 4px 32px rgba(0,0,0,0.35)" : "none",
        }}>
            <div className="container-rota">
                <div className="nav-bar">
                    <a className="nav-logo" href="#">
                        <div className="nav-logo-img">R4M</div>
                        <div style={{ lineHeight: 1.1 }}>
                            <span className="nav-logo-title">Rota 4 Mundos</span>
                            <span className="nav-logo-sub">Bioceanic Route</span>
                        </div>
                    </a>

                    <div className="nav-desktop">
                        {NAV_LINKS.map(link => {
                            const active = activePath === link.to;
                            return (
                                <a key={link.to} href="#" onClick={(e) => { e.preventDefault(); setActivePath(link.to); }}
                                   style={{
                                       padding: "7px 14px",
                                       borderRadius: 8,
                                       fontSize: 13,
                                       fontWeight: active ? 700 : 500,
                                       color: active ? "#fff" : "rgba(255,255,255,0.55)",
                                       background: active ? "rgba(255,255,255,0.1)" : "transparent",
                                       border: active ? "1px solid rgba(255,255,255,0.12)" : "1px solid transparent",
                                   }}>
                                    {link.to === "/apoie"
                                        ? <span style={{color: "#F4A261"}}>Apoie ✦</span>
                                        : link.label}
                                </a>
                            );
                        })}
                        <a href="#" style={{
                            marginLeft: 8,
                            display: "flex", alignItems: "center", gap: 6,
                            padding: "8px 18px", borderRadius: 10,
                            fontSize: 13, fontWeight: 700,
                            color: "#061B33",
                            background: "linear-gradient(135deg, #F4A261, #E9C46A)",
                        }}>
                            <IconUser size={13}/> Entrar
                        </a>
                    </div>

                    <button
                        onClick={() => setIsMobileOpen(!isMobileOpen)}
                        className="nav-burger"
                        aria-label={isMobileOpen ? "Fechar menu" : "Abrir menu"}
                    >
                        {isMobileOpen ? <IconX/> : <IconMenu/>}
                    </button>
                </div>
            </div>

            {isMobileOpen && (
                <div style={{
                    background: "rgba(6,27,51,0.97)",
                    backdropFilter: "blur(20px)",
                    borderTop: "1px solid rgba(255,255,255,0.07)",
                    overflow: "hidden",
                    animation: "fade-up 0.2s ease-out",
                }}>
                    <div className="container-rota" style={{ padding: "12px 1rem 20px", display: "flex", flexDirection: "column", gap: 2 }}>
                        {NAV_LINKS.map(link => {
                            const active = activePath === link.to;
                            return (
                                <a key={link.to} href="#" onClick={(e) => { e.preventDefault(); setActivePath(link.to); setIsMobileOpen(false); }}
                                   style={{
                                       padding: "14px 16px",
                                       borderRadius: 10,
                                       fontSize: 15,
                                       fontWeight: active ? 700 : 500,
                                       color: active ? "#fff" : "rgba(255,255,255,0.65)",
                                       background: active ? "rgba(255,255,255,0.08)" : "transparent",
                                       display: "block",
                                   }}>
                                    {link.to === "/apoie"
                                        ? <span style={{color: "#F4A261"}}>✦ Apoie o projeto</span>
                                        : link.label}
                                </a>
                            );
                        })}
                        <div style={{ borderTop: "1px solid rgba(255,255,255,0.07)", marginTop: 10, paddingTop: 12 }}>
                            <a href="#" style={{
                                display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                                padding: "14px", borderRadius: 12,
                                fontSize: 15, fontWeight: 700,
                                color: "#061B33",
                                background: "linear-gradient(135deg, #F4A261, #E9C46A)",
                            }}>
                                <IconUser size={16}/> Entrar
                            </a>
                        </div>
                    </div>
                </div>
            )}

            <style>{`
                .nav-bar {
                    display: flex; align-items: center; justify-content: space-between;
                    height: 64px;
                }
                .nav-logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
                .nav-logo-img {
                    width: 30px; height: 30px; border-radius: 8px;
                    background: linear-gradient(135deg, #F4A261, #E9C46A);
                    color: #061B33;
                    font-family: 'Bebas Neue', sans-serif;
                    font-size: 13px;
                    display: flex; align-items: center; justify-content: center;
                    flex-shrink: 0;
                    box-shadow: 0 4px 14px rgba(244,162,97,0.4);
                }
                .nav-logo-title {
                    font-family: 'Bebas Neue', sans-serif;
                    font-size: 1.05rem; color: #fff;
                    letter-spacing: 0.06em; display: block; white-space: nowrap;
                }
                .nav-logo-sub {
                    font-size: 9px; color: rgba(255,255,255,0.3);
                    font-family: Inter, sans-serif;
                    letter-spacing: 0.18em; text-transform: uppercase; white-space: nowrap;
                }
                .nav-desktop { display: flex; align-items: center; gap: 4px; }
                .nav-burger {
                    display: none;
                    background: rgba(255,255,255,0.07);
                    border: 1px solid rgba(255,255,255,0.1);
                    border-radius: 10px;
                    width: 42px; height: 42px;
                    align-items: center; justify-content: center;
                    color: #fff; cursor: pointer; flex-shrink: 0;
                }
                @media (min-width: 768px) {
                    .nav-bar { height: 72px; }
                    .nav-logo-img { width: 32px; height: 32px; }
                    .nav-logo-title { font-size: 1.15rem; }
                }
                @media (max-width: 767px) {
                    .nav-desktop { display: none !important; }
                    .nav-burger  { display: flex !important; }
                }
            `}</style>
        </nav>
    );
}

function App() {
    return (
        <React.Fragment>
            <Navbar/>
            <div className="fake-content">
                <h2>Página exemplo</h2>
                <p>Role para baixo para ver o navbar transitar de transparente para opaco (estado scrolled).</p>
                <p>No mobile (&lt; 768px) aparece o ícone de menu hambúrguer com hit-target de 42×42 px e o menu lateral abre com itens em alvo de 44px+ de altura.</p>
                <p style={{ marginTop: 40 }}>O breakpoint mudou de <strong style={{ color: '#F4A261' }}>960px</strong> para <strong style={{ color: '#F4A261' }}>768px</strong> (md do Tailwind).</p>
                <p style={{ marginTop: 200, opacity: 0.4 }}>(conteúdo continua...)</p>
            </div>
        </React.Fragment>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
